automation:

  # ==========================================================
  # ALERTE GLOBALE - Tamper / manipulation
  #
  # Rôle :
  # - alerter si une entité *_tamper passe de OFF à ON
  # - confirmer 5 secondes pour éviter les faux positifs
  #
  # Important :
  # - la liste de triggers doit rester alignée avec
  #   group.watchlist_tamper_all
  # - les futures entités restent en commentaire tant qu'elles
  #   n'existent pas réellement dans l'instance
  # ==========================================================
  - id: global_alerte_tamper
    alias: "Global - Alerte tamper"
    mode: queued
    max: 50

    triggers:
      - alias: "Tamper OFF -> ON"
        trigger: state
        entity_id:

          # --- Appart 1
          - binary_sensor.appart_1_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_1_capteur_d_ouverture_fenetre_salon_tamper
          # - binary_sensor.appart_1_detecteur_de_fumee_tamper

          # --- Appart 2
          - binary_sensor.appart_2_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_2_capteur_d_ouverture_fenetre_salon_tamper
          # - binary_sensor.appart_2_detecteur_de_fumee_tamper

          # --- Appart 3
          - binary_sensor.appart_3_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_3_capteur_d_ouverture_fenetre_chambre_tamper
          # - binary_sensor.appart_3_detecteur_de_fumee_tamper

          # --- Appart 4
          - binary_sensor.appart_4_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_4_capteur_d_ouverture_fenetre_chambre_tamper
          - binary_sensor.appart_4_detecteur_de_fumee_tamper

          # --- Appart 5
          - binary_sensor.appart_5_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_5_capteur_d_ouverture_fenetre_chambre_tamper
          - binary_sensor.appart_5_capteur_d_ouverture_fenetre_salon_tamper
          # - binary_sensor.appart_5_detecteur_de_fumee_tamper

          # --- Appart 6
          - binary_sensor.appart_6_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_6_capteur_d_ouverture_fenetre_toit_tamper
          - binary_sensor.appart_6_capteur_d_ouverture_fenetre_salon_tamper
          # - binary_sensor.appart_6_detecteur_de_fumee_tamper

          # --- Appart 7
          - binary_sensor.appart_7_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_7_capteur_d_ouverture_fenetre_toit_tamper
          - binary_sensor.appart_7_capteur_d_ouverture_fenetre_salon_tamper
          # - binary_sensor.appart_7_detecteur_de_fumee_tamper

          # --- Appart 8
          - binary_sensor.appart_8_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_8_capteur_d_ouverture_fenetre_toit_tamper
          - binary_sensor.appart_8_capteur_d_ouverture_fenetre_salon_tamper
          # - binary_sensor.appart_8_detecteur_de_fumee_tamper

          # --- Appart 9
          - binary_sensor.appart_9_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_9_capteur_d_ouverture_fenetre_toit_tamper
          - binary_sensor.appart_9_capteur_d_ouverture_fenetre_salon_tamper
          # - binary_sensor.appart_9_detecteur_de_fumee_tamper

          # --- Appart 10
          - binary_sensor.appart_10_capteur_d_ouverture_porte_entree_tamper
          - binary_sensor.appart_10_capteur_d_ouverture_fenetre_chambre_tamper
          - binary_sensor.appart_10_capteur_d_ouverture_fenetre_salon_gauche_tamper
          - binary_sensor.appart_10_capteur_d_ouverture_fenetre_salon_droite_tamper
          # - binary_sensor.appart_10_detecteur_de_fumee_tamper

        from: "off"
        to: "on"

    actions:
      - alias: "1/ Attendre 5 secondes pour confirmer"
        delay: "00:00:05"

      - alias: "2/ Re-check, toujours ON ?"
        condition: template
        value_template: "{{ is_state(trigger.entity_id, 'on') }}"

      - alias: "3/ Préparer les infos"
        variables:
          capteur: "{{ state_attr(trigger.entity_id, 'friendly_name') or 'Capteur inconnu' }}"
          appart: >-
            {% set m = trigger.entity_id | regex_findall('appart_(\\d+)') %}
            {% if m | length > 0 %}
              Appart {{ m[0] }}
            {% else %}
              Appart (inconnu)
            {% endif %}

      - alias: "4/ Envoyer l'alerte"
        action: script.alerte_globale_phone_telegram_topic
        data:
          title: "{{ appart }} - Manipulation détectée"
          message: "{{ capteur }} a signalé une manipulation."